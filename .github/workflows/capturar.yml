name: Ruta B - Polling RSS
on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos
  workflow_dispatch: # Nos permite ejecutarlo manualmente con un botón

jobs:
  vigilar_twitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar librerías
        run: pip install requests feedparser
        
      - name: Ejecutar radar
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RSS_URL: ${{ secrets.RSS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }} # <-- LÍNEA NUEVA
        run: python capturar.py
